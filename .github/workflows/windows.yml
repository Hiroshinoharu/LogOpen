name: Windows CI and release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto reads commit messages)
        type: choice
        default: auto
        options: [auto, patch, minor, major]

permissions:
  contents: read

# Keep rapid default-branch pushes queued rather than dropping pending releases.
# The lock spans planning, testing, packaging, and publication.
concurrency:
  group: ${{ github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request' && 'logopen-stable-release' || format('ci-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false

jobs:
  build:
    name: Test and package Windows
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      RELEASE_BUILD: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
      BEFORE_SHA: ${{ github.event.before }}
      BUMP: ${{ inputs.bump || 'auto' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Plan version without creating a tag
        shell: pwsh
        run: |
          $arguments = @('scripts/release.py', 'plan', '--bump', $env:BUMP)
          if ($env:RELEASE_BUILD -ne 'true') { $arguments += '--ci-only' }
          if ($env:BEFORE_SHA) { $arguments += @('--before', $env:BEFORE_SHA) }
          python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Version planning failed.' }
      - name: Test, build, and check packaged startup
        shell: pwsh
        run: |
          $plan = Get-Content -LiteralPath build/release/plan.json -Raw | ConvertFrom-Json
          ./scripts/build.ps1 -Python python -UseExistingEnvironment -Version $plan.version -Installer -DownloadInno
      - name: Stage release assets and checksums
        run: python scripts/release.py stage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-package
          path: build/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish versioned release
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
          architecture: x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-package
          path: build/release/
      - name: Verify hashes, tag the tested commit, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        run: python scripts/release.py publish
